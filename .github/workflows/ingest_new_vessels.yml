name: Ingest New Vessels

# input/new.txt 가 있으면 vessels.json 에 병합하고 커밋한다.
# - 매일 00:40 UTC (09:40 KST) = 테이블 수집(01:00 UTC)보다 앞서 실행
# - input/new.txt 가 push 되면 즉시 실행
# - 수동 실행 가능

on:
  workflow_dispatch:
  schedule:
    - cron: "40 0 * * *"
  push:
    paths:
      - "input/new.txt"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new.txt
        id: check
        run: |
          if [ -f input/new.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "input/new.txt 없음. 건너뜁니다."
          fi

      - name: Set up Python
        if: steps.check.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge new vessels
        if: steps.check.outputs.found == 'true'
        id: merge
        run: python scripts/merge_new_vessels.py

      - name: Job summary
        if: steps.check.outputs.found == 'true'
        run: cat output/merge_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: steps.check.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/vessels.json input/archive input/new.txt || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 신규 선박 ${{ steps.merge.outputs.added_count }}척 등록"
            git push
          fi

      - name: Fail if parse errors
        if: steps.check.outputs.found == 'true' && steps.merge.outputs.error_count != '0'
        run: |
          echo "::error::new.txt 에 처리 실패한 행이 ${{ steps.merge.outputs.error_count }}건 있습니다. Job Summary를 확인하세요."
          exit 1

  # IMO 미확보 선박의 IMO를 API로 채운다. 수동 실행 전용.
  bootstrap-imo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ingest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap IMO
        env:
          MARINESIA_API_KEY: ${{ secrets.MARINESIA_API_KEY }}
        run: python scripts/bootstrap_imo.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/vessels.json
          if git diff --staged --quiet; then
            echo "IMO 변경 없음"
          else
            git commit -m "chore: IMO 번호 보완"
            git push
          fi
