name: Start Marinesia Cycle

on:
  workflow_dispatch:
    inputs:
      cycle_count:
        description: "How many full cycles to run"
        required: true
        default: "3"

permissions:
  contents: write

jobs:
  start-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3

      - name: Ensure output directory exists
        run: |
          mkdir -p output

      - name: Reset latest_positions.json
        run: |
          cat > output/latest_positions.json << 'EOF'
          []
          EOF

      - name: Reset summary.json
        run: |
          cat > output/summary.json << EOF
          {
            "generated_at": null,
            "summary": {
              "total": 0,
              "live": 0,
              "stale": 0,
              "no_signal": 0,
              "cycle_completed_at": null,
              "remaining_cycles": ${{ inputs.cycle_count }}
            },
            "map_items": []
          }
          EOF

      - name: Reset rotation_state.json
        run: |
          cat > output/rotation_state.json << EOF
          {
            "enabled": true,
            "next_index": 0,
            "cycle_no": 1,
            "remaining_cycles": ${{ inputs.cycle_count }},
            "last_completed_cycle_at": null
          }
          EOF

      - name: Run first fetch immediately
        env:
          MARINESIA_API_KEY: ${{ secrets.MARINESIA_API_KEY }}
        run: |
          python fetch_marinesia_position.py

      - name: Show files after first fetch
        run: |
          echo "---- latest_positions.json ----"
          cat output/latest_positions.json || true
          echo
          echo "---- summary.json ----"
          cat output/summary.json || true
          echo
          echo "---- rotation_state.json ----"
          cat output/rotation_state.json || true

      - name: Commit initialized output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/latest_positions.json output/summary.json output/rotation_state.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Start Marinesia cycle (${{ inputs.cycle_count }} cycle(s)) and fetch first vessel"
            git push
          fi

      - name: Decide whether cycle is complete
        id: cycle_check
        run: |
          python - << 'PY'
          import json
          import os

          with open("output/rotation_state.json", "r", encoding="utf-8") as f:
              state = json.load(f)

          completed = "true" if state.get("next_index") == 0 else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"completed={completed}\n")

          print(f"completed={completed}")
          PY

      - name: Send summary email if cycle completed immediately
        if: steps.cycle_check.outputs.completed == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COMPANY_EMAIL_TO: ${{ secrets.COMPANY_EMAIL_TO }}
        run: |
          python send_summary_email.py
